name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK (signed with debug keystore)
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: List APK
        run: |
          ls -lah app/build/outputs/apk/debug/ || true
          find app/build/outputs/apk -name "*.apk" -exec ls -lah {} \;

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AntiDetectBrowser-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error

      - name: Build Release APK (also signed with debug key for testing)
        run: ./gradlew assembleRelease --stacktrace --no-daemon
        continue-on-error: true

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AntiDetectBrowser-release-testsigned
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14
          if-no-files-found: ignore
